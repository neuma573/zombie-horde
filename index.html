<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Zombie Horde</title>
    <style>
      html,
      body,
      #game {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        background: #111;
        overflow: hidden;
      }

      #game {
        position: fixed;
        inset: 0;
        min-width: 0;
        min-height: 0;
        height: 100dvh;
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
      }

      #game canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        color: #9aabb5;
        background: #11161c;
        font: 700 14px Arial, sans-serif;
        letter-spacing: 0.14em;
      }

    </style>
  </head>
  <body>
    <div id="boot-loading" role="status" aria-live="polite">LOADING...</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
